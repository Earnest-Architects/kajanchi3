<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Labougainvillea Virtual Tour | Rinaldisign</title>
<meta name="description" content="360° Panorama" />

<!-- Open Graph / preview link saat dibagikan ke sosial media.
     Pakai path relatif supaya otomatis mengikuti domain hosting manapun
     tanpa perlu diedit ulang tiap kali template ini di-duplikasi. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Labougainvillea Virtual Tour" />
<meta property="og:description" content="360° Panorama" />
<meta property="og:image" content="assets/social-share.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Labougainvillea Virtual Tour" />
<meta name="twitter:description" content="360° Panorama" />
<meta name="twitter:image" content="assets/social-share.jpg" />

<link rel="icon" href="favicon/favicon.ico" sizes="any">
<link rel="icon" href="favicon/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="lib/pannellum.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <div id="panorama" role="application" aria-label="360-degree panorama, drag to look around"></div>

  <div id="loading-screen">
    <div class="brand-reveal">
      <span class="brand-line" aria-hidden="true"></span>
      <img
        class="brand-mark"
        src="brand/earnest-logo-light.png"
        alt="360"
        width="691"
        height="99"
      />
      <span class="brand-line" aria-hidden="true"></span>
    </div>
    <div class="loading-progress">
      <div class="loading-ring" aria-hidden="true"></div>
      <p id="loading-text">Loading Panorama..</p>
    </div>
  </div>

  <header class="hud-top">
    <img class="hud-logo" src="brand/earnest-logo-light.png" alt="" aria-hidden="true" />
    <p class="eyebrow" id="scene-title">Bedroom</p>
    <h1 id="project-title">Labougainvillea Virtual Tour</h1>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ============ Floorplan (bottom-right) ============ -->
  <div class="nav-panel">
    <div class="floorplan-panel" id="floorplan-panel">
      <div class="floorplan-header">
        <p class="floorplan-title">Layout</p>
        <button id="floorplan-hide-btn" class="icon-btn" aria-label="Hide floor plan" title="Hide floor plan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="floor-tabs" id="floor-tabs" role="tablist" aria-label="Select floor"></div>

      <div class="floorplan-viewport" id="floorplan-viewport">
        <div class="floorplan-canvas" id="floorplan-canvas">
          <img id="floorplan-img" src="assets/floorplan.jpg" alt="Floor plan with viewpoints" draggable="false" />
          <!-- viewpoint dots diinjeksikan oleh js/floorplan.js -->
        </div>
      </div>

      <div class="floorplan-zoom-controls">
        <button type="button" id="zoom-out-btn" class="zoom-btn" aria-label="Zoom out" title="Zoom out">−</button>
        <button type="button" id="zoom-reset-btn" class="zoom-btn zoom-reset" aria-label="Reset zoom" title="Reset zoom">1×</button>
        <button type="button" id="zoom-in-btn" class="zoom-btn" aria-label="Zoom in" title="Zoom in">+</button>
      </div>

      <div class="floorplan-resize-handle" id="floorplan-resize-handle" title="Drag to resize (double-click to reset)" aria-hidden="true">
        <svg viewBox="0 0 12 12" fill="currentColor">
          <circle cx="2" cy="2" r="1"/>
          <circle cx="2" cy="6" r="1"/>
          <circle cx="6" cy="2" r="1"/>
        </svg>
      </div>
    </div>

    <button id="floorplan-show-btn" class="rail-btn floorplan-show-btn" aria-label="Show floor plan" title="Show floor plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 3v18M3 9h6"/>
      </svg>
    </button>
  </div>

  <!-- ============ Icon rail terpadu (pojok kiri bawah) ============ -->
  <div class="icon-rail" id="icon-rail">

  <div class="notes-nav-panel">
    <div class="floorplan-panel notes-list-panel hidden" id="notes-list-panel">
      <div class="floorplan-header">
        <p class="floorplan-title">Notes</p>
        <div class="floorplan-header-actions">
          <button id="notes-list-print-btn" class="icon-btn" aria-label="Print notes list" title="Print notes list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
          </button>
          <button id="notes-list-hide-btn" class="icon-btn" aria-label="Hide notes list" title="Hide notes list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="notes-list-body" id="notes-list-body">
        <!-- item catatan diinjeksikan oleh js/notes-list.js -->
      </div>
    </div>

    <button id="notes-list-show-btn" class="rail-btn floorplan-show-btn visible" aria-label="Show notes list" title="Show notes list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </button>
  </div>

  <a id="note-btn" class="rail-btn" href="note-finder.html" aria-label="Leave a note" title="Leave a note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  </a>

  <div class="share-nav">
    <button id="share-btn" class="rail-btn" aria-label="Share link" title="Share link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/>
        <line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/>
      </svg>
    </button>
    <div class="share-popup" id="share-popup" hidden role="dialog" aria-label="Share this tour">
      <p class="share-popup-title">Scan to open</p>
      <div class="share-qr-card">
        <canvas id="share-qr-canvas" width="188" height="188"></canvas>
      </div>
      <p class="share-link-text" id="share-link-text"></p>
      <div class="share-popup-actions">
        <button type="button" id="share-copy-btn" class="share-action-btn">Copy link</button>
        <button type="button" id="share-native-btn" class="share-action-btn share-action-btn--ghost">Share…</button>
      </div>
    </div>
  </div>

  <button id="print-scene-btn" class="rail-btn" aria-label="Print this view" title="Print this view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 6 2 18 2 18 9"/>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <rect x="6" y="14" width="12" height="8"/>
    </svg>
  </button>

  <button id="vr-btn" class="rail-btn" aria-label="View in VR" title="View in VR">
    <span class="rail-vr-text" aria-hidden="true">VR</span>
  </button>

  <button id="fullscreen-btn" class="rail-btn" aria-label="Fullscreen" title="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
    </svg>
  </button>

  <button id="auto-tour-btn" class="rail-btn" aria-label="Play auto tour" title="Play auto tour">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <div id="auto-tour-controls" class="auto-tour-controls hidden">
    <button id="auto-tour-prev-btn" class="rail-btn" aria-label="Previous scene" title="Previous scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <button id="auto-tour-pause-btn" class="rail-btn" aria-label="Pause auto tour" title="Pause auto tour">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="5" width="4" height="14" rx="1"/>
        <rect x="14" y="5" width="4" height="14" rx="1"/>
      </svg>
    </button>
    <button id="auto-tour-next-btn" class="rail-btn" aria-label="Next scene" title="Next scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
    <button id="auto-tour-hotspots-btn" class="rail-btn" aria-label="Hide hotspots" title="Hide hotspots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  </div>

</div>

<script src="lib/pannellum.js"></script>
<script src="lib/qrcode.js"></script>

<!--
  Semua modul di bawah ini adalah ES Module (type="module"), jadi
  urutan tag TIDAK memengaruhi urutan eksekusi internalnya — setiap
  modul mengimpor dependensinya sendiri lewat "import" di dalam file
  js/*.js, dan browser otomatis memuatnya dengan urutan yang benar.

  Konten tur (lantai, denah, gambar 360, pitch point) ada semuanya
  di js/content.js — file itu satu-satunya yang perlu diedit untuk
  menambah/mengubah konten tur.
-->
<script type="module" src="js/viewer.js"></script>
<script type="module" src="js/print-scene.js"></script>
<script type="module" src="js/floorplan.js"></script>
<script type="module" src="js/notes-list.js"></script>
<script type="module" src="js/auto-tour.js"></script>
</body>
</html>
